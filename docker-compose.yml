version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: churnsense-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Sudhanshu_2026
      POSTGRES_DB: churnsense
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d churnsense"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: churnsense-backend
    ports:
      - "5005:5005"
    environment:
      - FLASK_SECRET_KEY=churnsense-super-secret-key-change-in-production
      - FLASK_ENV=production
      - JWT_SECRET_KEY=jwt-secret-key-change-in-production
      - JWT_ACCESS_TOKEN_EXPIRES_HOURS=24
      - DATABASE_URL=postgresql://postgres:Sudhanshu_2026@db:5432/churnsense
      - MODEL_PATH=model/churn_model.joblib
      - SCALER_PATH=model/scaler.joblib
      - HOST=0.0.0.0
      - PORT=5005
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend-next
      dockerfile: Dockerfile
    container_name: churnsense-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5005
    depends_on:
      - backend

volumes:
  pgdata:
